name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Haskell (GHC & Cabal)
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.14.2.0'

      - name: Cache Cabal store and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ./build/dist-newstyle
          key: ${{ runner.os }}-cabal-ghc967-${{ hashFiles('build/static-site.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-ghc967-

      - name: Install esbuild and system libraries
        run: |
          sudo apt-get update && sudo apt-get install -y esbuild libpq-dev

      - name: Build and generate site
        run: |
          cd build
          cabal update
          cabal run

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs